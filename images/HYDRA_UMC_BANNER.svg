<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 125" width="500" height="125">
  <defs>
    <linearGradient id="bgTitaniumUltraWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="50%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>

    <linearGradient id="greenNeonSlim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#009933"/>
    </linearGradient>

    <linearGradient id="orangeLaserSlim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FF3300"/>
    </linearGradient>

    <linearGradient id="metalArmSlim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="shimmerSweepSlim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B949E"/>
      <stop offset="30%" stop-color="#8B949E"/>
      <stop offset="50%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#8B949E"/>
      <stop offset="100%" stop-color="#8B949E"/>
      
      <animate attributeName="x1" from="-100%" to="100%" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="2.2s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="neonGlowSlim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="pcbGridSlim" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00FF66" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .title-hydra-slim {
      font-family: 'Segoe UI', 'Roboto', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 3px;
      fill: #FFFFFF;
      text-anchor: middle;
    }

    .subtitle-controller-slim {
      fill: url(#shimmerSweepSlim);
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-anchor: middle;
    }

    .author-branding-slim {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 4.75px;
      letter-spacing: 1px;
      fill: #FF6600;
      text-anchor: middle;
    }

    .pcb-text-slim {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      fill: #00FF66;
      opacity: 0.25;
    }
  </style>

  <rect width="500" height="125" fill="url(#bgTitaniumUltraWide)"/>
  
  <rect width="500" height="125" fill="url(#pcbGridSlim)"/>

  <g id="pcb-layer-slim" stroke="#00FF66" fill="none" opacity="0.15">
    <g stroke-width="0.8">
      <path d="M 10,15 H 140 L 160,35 H 480"/>
      <path d="M 10,110 H 140 L 160,90 H 480"/>
      <path d="M 300,10 V 40 L 315,55 H 490"/>
      <path d="M 300,115 V 85 L 315,70 H 490"/>
    </g>

    <path d="M 170,25 H 200 L 200,20 L 205,20 L 205,30 L 210,30 L 210,25 H 240" stroke-width="0.8" opacity="0.4"/>
    
    <g transform="translate(475, 25)" opacity="0.3">
      <rect x="0" y="0" width="15" height="75" stroke="#00FF66" stroke-width="0.5"/>
      <circle cx="7.5" cy="10" r="1.5" fill="#00FF66"/>
      <circle cx="7.5" cy="25" r="1.5" fill="#00FF66"/>
      <circle cx="7.5" cy="40" r="1.5" fill="#00FF66"/>
      <circle cx="7.5" cy="55" r="1.5" fill="#00FF66"/>
      <circle cx="7.5" cy="65" r="1.5" fill="#00FF66"/>
    </g>

    <g transform="translate(430, 95)" opacity="0.35">
      <rect x="-12" y="-8" width="24" height="16" rx="1" stroke="#00FF66" stroke-width="0.8" fill="#00FF66" fill-opacity="0.05"/>
      <text x="0" y="2" text-anchor="middle" class="pcb-text-slim" font-size="4">MCU_DUAL</text>
    </g>

    <g fill="#00FF66" opacity="0.3">
      <circle cx="160" cy="35" r="1.5"/>
      <circle cx="160" cy="90" r="1.5"/>
      <circle cx="315" cy="55" r="1.5"/>
      <circle cx="315" cy="70" r="1.5"/>
    </g>
  </g>

  <g transform="translate(110, 62.5) scale(0.27)">
    <g stroke="#1A202C" stroke-width="4.5" fill="none">
      <path d="M-45,-35 L-160,-135 L-300,-135"/>
      <path d="M-55,-12 L-200,-55 L-330,-55"/>
      <path d="M-55,12 L-200,55 L-330,55"/>
      <path d="M-45,35 L-160,135 L-300,135"/>
      <path d="M45,-35 L160,-135 L300,-135"/>
      <path d="M55,-12 L200,-55 L330,-55"/>
      <path d="M55,12 L200,55 L330,55"/>
      <path d="M45,35 L160,135 L300,135"/>
    </g>

    <g stroke="#00E5FF" stroke-width="4" fill="none" filter="url(#neonGlowSlim)" stroke-linecap="round">
      <path d="M-45,-35 L-160,-135 L-300,-135" stroke-dasharray="30, 220" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="250" to="0" dur="1.2s" repeatCount="indefinite" />
      </path>
      <path d="M-55,-12 L-200,-55 L-330,-55" stroke-dasharray="35, 260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="295" to="0" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
      </path>
      <path d="M-55,12 L-200,55 L-330,55" stroke-dasharray="35, 260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="295" to="0" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>
      </path>
      <path d="M-45,35 L-160,135 L-300,135" stroke-dasharray="30, 220" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="250" to="0" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
      </path>

      <path d="M45,-35 L160,-135 L300,-135" stroke-dasharray="30, 220" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="250" to="0" dur="1.2s" repeatCount="indefinite" />
      </path>
      <path d="M55,-12 L200,-55 L330,-55" stroke-dasharray="35, 260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="295" to="0" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
      </path>
      <path d="M55,12 L200,55 L330,55" stroke-dasharray="35, 260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="295" to="0" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>
      </path>
      <path d="M45,35 L160,135 L300,135" stroke-dasharray="30, 220" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="250" to="0" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
      </path>
    </g>

    <path d="M-300,-146 L-325,-146 L-335,-135 L-325,-124 L-300,-124 Z" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>
    <polygon points="-330,-67 -365,-55 -330,-43" fill="url(#orangeLaserSlim)" filter="url(#neonGlowSlim)"/>
    <circle cx="-372" cy="-55" r="4.5" fill="#FF6600"/>
    <polygon points="-330,43 -360,55 -330,67" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>
    <rect x="-330" y="118" width="30" height="34" rx="4" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>

    <path d="M300,-146 L325,-146 L335,-135 L325,-124 L300,-124 Z" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>
    <polygon points="330,-67 365,-55 330,-43" fill="url(#orangeLaserSlim)" filter="url(#neonGlowSlim)"/>
    <circle cx="372" cy="-55" r="4.5" fill="#FF6600"/>
    <polygon points="330,43 360,55 330,67" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>
    <rect x="300" y="118" width="30" height="34" rx="4" fill="#2D3748" stroke="#00FF66" stroke-width="2"/>

    <g>
      <animateTransform 
        attributeName="transform" 
        type="scale" 
        values="1 1; -1 1; 1 1" 
        dur="6s" 
        repeatCount="indefinite" 
        keyTimes="0; 0.5; 1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
      />

      <polygon points="0,-100 68,-56 68,56 0,100 -68,56 -68,-56" 
               fill="url(#metalArmSlim)" stroke="#00FF66" stroke-width="3.5" filter="url(#neonGlowSlim)"/>
               
      <path d="M-40,-56 L-18,-56 L-18,-12 L18,-12 L18,-56 L40,-56 L40,56 L18,56 L18,12 L-18,12 L-18,56 L-40,56 Z" 
            fill="url(#greenNeonSlim)"/>
    </g>

    <circle cx="-160" cy="-135" r="5.5" fill="#00FF66"/>
    <circle cx="-200" cy="-55" r="5.5" fill="#00FF66"/>
    <circle cx="-200" cy="55" r="5.5" fill="#00FF66"/>
    <circle cx="-160" cy="135" r="5.5" fill="#00FF66"/>
    <circle cx="160" cy="-135" r="5.5" fill="#00FF66"/>
    <circle cx="200" cy="-55" r="5.5" fill="#00FF66"/>
    <circle cx="200" cy="55" r="5.5" fill="#00FF66"/>
    <circle cx="160" cy="135" r="5.5" fill="#00FF66"/>
  </g>

  <g transform="translate(365, 0)">
    <text x="0" y="48" class="title-hydra-slim">
      HYDRA<tspan fill="#00FF66">-UM</tspan><tspan fill="#FF6600">C</tspan>
    </text>
    
    <text x="0" y="71" class="subtitle-controller-slim">
      UNIVERSAL MULTI-AXIS CONTROLLER
    </text>

    <text x="0" y="94" class="author-branding-slim" filter="url(#neonGlowSlim)">
      JUANENRAC <tspan fill="#8B949E">|</tspan> ELECTRO HOBBY 3D
    </text>
  </g>
</svg>
