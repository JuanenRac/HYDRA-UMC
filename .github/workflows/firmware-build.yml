# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request. It compiles the six firmware components of this repository
# with build_firmware.sh in CI mode (HYDRA_UMC_CI=1: no version change, nothing tracked is rewritten), checks the images, and uploads them with SHA256SUMS and a build manifest as one artifact with a build-provenance attestation.
#
# It holds no key and signs nothing. The bootloaders hold a table of PUBLIC Ed25519 keys (docs/image_trust.json). The flavour input picks the table:
# "dev" (the default) is the bench table, whose seed is public (signing_key_kind "dev"); "release" is the official table (HYDRA_UMC_RELEASE=1), which stays
# closed (it trusts nobody and installs nothing) until the maintainer puts the public half of the image-signing key in docs/image_trust.json. A build
# whose bootloaders do not hold exactly the table of their flavour fails. The size of the bootloaders is measured with arm-none-eabi-size and the build
# fails when one leaves less free space in its reserved region than the margin of tools/bootloader_size.json. The images are signed afterwards, on the
# maintainer's machine, with tools/sign_release.py. With dry_run on (the default) nothing but the artifact is made; with it
# off a DRAFT pre-release named v<version>-bench with the unsigned files is also prepared (its tag is never the tag of an official release).
# Only code that is in main is built for a draft pre-release (dry_run off) or with the official trust table (flavour release). A dry run with the dev table may build a branch
# that is not in main yet, to compile a change before it is merged: it makes no draft, signs nothing, holds no secret and its artifact is unsigned. The owner is still the only one who starts it,
# and the commit it builds is pinned in the plan and checked out again by its SHA.
# A failed or stuck build writes the Job Summary and opens (or updates) the issue "build-failed"; a later good build closes it.

name: Firmware build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft pre-release"
        type: boolean
        required: true
        default: true
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main
      flavour:
        description: "Trust table of the bootloaders: dev (bench, public key) or release (official, closed until the image key exists)"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - release

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Only the owner starts a build
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository starts a build"; exit 1; }

      - name: Check the inputs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Make sure the commit belongs to the main branch (a dry run may check a branch)
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          set -euo pipefail
          # Only code that is already in main is built for anything that can become a release: a draft pre-release (dry_run off) and the official trust table
          # (flavour release) are refused for a branch or a fork commit that is not in main. A DRY RUN (dry_run on, which makes no draft pre-release, signs nothing, holds no
          # secret and uploads only an unsigned artifact) may check a commit that is not in main yet, with the dev trust table, so a change of the firmware is compiled before it is merged.
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The commit $(git rev-parse --short HEAD) is part of the main branch."
          elif [ "$DRY_RUN" = "true" ] && [ "$FLAVOUR" = "dev" ]; then
            echo "::notice::the commit $(git rev-parse --short HEAD) is NOT in main: this dry run only checks that it compiles; its artifact is unsigned and is not to be released"
            echo "### Branch check: the commit $(git rev-parse --short HEAD) is not in main (dry run, dev table, unsigned artifact)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the commit $(git rev-parse --short HEAD) is not part of the main branch; merge it first (only a dry run with the dev trust table may build a commit that is not in main)"; exit 1
          fi

      - name: Work out the version and pin the commit
        id: plan
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          set -euo pipefail
          # The attestation of the artifact is verified against the commit of THIS run (github.sha). Anything that can become a release (a draft, or the official
          # trust table) is therefore built from exactly that commit: another ref, even an older commit of main, is refused. Only a dry run with the dev table may
          # compile another ref, and its artifact is not signed from.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && ! { [ "$DRY_RUN" = "true" ] && [ "$FLAVOUR" = "dev" ]; }; then
            echo "::error::the ref is the commit $(git rev-parse --short HEAD) but this run is of $(echo "$GITHUB_SHA" | cut -c1-9): start the workflow from the commit to build (use the ref that is the tip of main); only a dry run with the dev trust table may build another ref"; exit 1
          fi
          echo "version=$(python3 -c "import json; print(json.load(open('hydra-umc.project.json', encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build the six components
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Make sure the build has no private key to take
        shell: bash
        run: |
          set -euo pipefail
          for name in HYDRA_UMC_RELEASE HYDRA_FW_UPDATE_PUBKEY_HEX HYDRA_FW_HMAC_KEY_HEX HYDRA_FW_SIGNING_SEED_FILE; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set in this job; a build made here must use the public development keys"
              exit 1
            fi
          done

      - name: Install the ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Compile the firmware without a version bump
        env:
          HYDRA_UMC_CI: "1"
          HYDRA_UMC_RELEASE: ${{ inputs.flavour == 'release' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_firmware.sh
          ./build_firmware.sh
          arm-none-eabi-gcc --version | head -n 1 > toolchain.txt

      - name: Check the images and name the files
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import os, re, shutil, sys
          from pathlib import Path
          expected = ["KB_CM4_APP", "KB_CM4_BOOTLOADER", "KB_CM7_APP", "KB_CM7_BOOTLOADER", "RCB_APP", "RCB_BOOTLOADER"]
          out = Path("out")
          found = {}
          for image in sorted(Path("firmware").glob("HYDRA_*.bin")):
              match = re.fullmatch(r"HYDRA_(.+)_v(\d+\.\d+\.\d+)\.bin", image.name)
              if match:
                  found[match.group(1)] = (image, match.group(2))
          if sorted(found) != expected:
              sys.exit("::error::unexpected images: " + ", ".join(sorted(found)))
          if found["RCB_APP"][1] != os.environ["VERSION"]:
              sys.exit("::error::the controller application is " + found["RCB_APP"][1] + ", hydra-umc.project.json says " + os.environ["VERSION"] + " (raise the version BEFORE the build)")
          for image, version in found.values():
              if Path(str(image)[:-4] + ".sig").exists():
                  sys.exit("::error::" + image.name + " has a signature: nothing may be signed in Actions")
              for suffix in (".bin", ".hex"):
                  shutil.copyfile(str(image)[:-4] + suffix, out / (image.name[:-4] + suffix))
          print("images ok:", ", ".join(image.name for image, _ in found.values()))
          PY
          # every bootloader must hold, at the fixed offset, exactly the trust table of the flavour (release: the closed table while the key does not exist)
          for pair in rcb:RCB kb_cm7:KB_CM7 kb_cm4:KB_CM4; do
            python3 tools/image_trust.py check firmware/HYDRA_${pair#*:}_BOOTLOADER_v*.bin "${pair%%:*}" "$FLAVOUR"
          done
          cp toolchain.txt out/toolchain.txt.tmp
          {
            echo "### HYDRA-UMC firmware (flavour: $FLAVOUR)"
            (cd out && sha256sum HYDRA_*.bin | sed 's/^/- /')
            echo "- toolchain: \`$(cat toolchain.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure the bootloaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootloader_size.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parts
          path: |
            out/HYDRA_*
            out/toolchain.txt.tmp
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect and attest
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      FLAVOUR: ${{ inputs.flavour }}
    steps:
      - name: Download the images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: parts
          path: files

      - name: Write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd files
          mv toolchain.txt.tmp /tmp/toolchain.txt
          sha256sum HYDRA_* > SHA256SUMS
          python3 - <<'PY'
          import json, os
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name)})
          json.dump({
              "schema": "hydra-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "hydra-umc", "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "toolchain": open("/tmp/toolchain.txt", encoding="utf-8").read().strip(), "signing_key_kind": os.environ["FLAVOUR"],
              "signed": False, "files": files,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            files/HYDRA_*
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-hydra-umc-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER: ${{ github.repository }}/.github/workflows/firmware-build.yml
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-hydra-umc-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and manifest["signing_key_kind"] in ("dev", "release") and manifest["files"], "unexpected manifest"
          print("manifest ok:", manifest["project"], manifest["version"], len(manifest["files"]), "files")
          PY
          for file in HYDRA_* SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-digest "$GITHUB_SHA" >/dev/null
            echo "attestation ok: $file"
          done

  draft:
    name: Prepare the draft pre-release (owner approval)
    needs: [plan, collect, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
      FLAVOUR: ${{ inputs.flavour }}
    steps:
      - name: Only the owner prepares a draft
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository prepares a draft"; exit 1; }

      - name: Download the verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-hydra-umc-${{ needs.plan.outputs.version }}
          path: files

      - name: Prepare the draft pre-release with the unsigned files
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION-bench"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag already exists: raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --prerelease --target "$SHA" --title "HYDRA-UMC firmware $VERSION (unsigned bench build)" \
            --notes "Unsigned build made by GitHub Actions (trust table: $FLAVOUR). Not an official release until it is signed on the maintainer's machine; do not install it on a board that anybody else can reach."
          echo "- draft pre-release \`$tag\` prepared with the unsigned files" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.collect.result }} ${{ needs.verify.result }}
      DRAFT: ${{ needs.draft.result }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state open --json number --jq '.[0].number // empty')"
          bad=""
          for r in $RESULTS; do [ "$r" = "success" ] || bad="$bad $r"; done
          # the draft job is skipped on purpose in a dry run; in any other case it must have passed
          if [ "$DRAFT" != "success" ] && ! { [ "$DRAFT" = "skipped" ] && [ "$DRY_RUN" = "true" ]; }; then bad="$bad draft:$DRAFT"; fi
          if [ -n "$bad" ]; then
            body="The firmware build failed (plan / build / collect / verify: $RESULTS, draft: $DRAFT; anything but success counts as a failure: failure, timed out, cancelled or skipped). Run: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "A build in GitHub Actions failed" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "Firmware build failed" --body "$body"
            fi
            echo "### The build failed: issue build-failed updated" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "A later build passed: $RUN_URL"
          fi

      - name: The notice itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::The build did not pass (${RESULTS}) and the issue build-failed could not be written. Run: ${RUN_URL}"
          echo "### The build did not pass and the issue could not be written" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: ${RESULTS}. Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
