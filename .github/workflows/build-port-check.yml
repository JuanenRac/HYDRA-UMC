name: Build script host tests

# Started by hand. Runs the logic tests of the host of tools/build_firmware.py with a real C compiler and fails if any of them does not pass.
# Nothing is built for a board and nothing is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Run the logic tests of the host with a real compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the build script tests
        env:
          HYDRA_BUILD_PORT_REAL: "1"
        run: python -m unittest tests.test_build_firmware_port -v
