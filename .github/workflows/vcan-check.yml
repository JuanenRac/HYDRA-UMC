# Started by hand, and on a pull request that touches the bus contract, the checks or this file. It brings up a virtual CAN interface of the Linux kernel (vcan0) on the runner and runs tests/vcan_check.py and tests/vcan_urtc_vectors.py over it: the frames
# of the emergency stop, the slot scan and the health frame travel through real kernel sockets, and the node state machine of the reference reads
# them back from the socket. It checks the identifier table and the frame layouts with a real CAN stack; it does not model arbitration or bit timing
# and it says nothing about a board. If the runner cannot load the vcan module the job says so and fails.

name: Virtual CAN check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/vcan_check.py"
      - "tests/vcan_urtc_vectors.py"
      - "tests/urtc_can_conformance_vectors.json"
      - "tools/can_ids.py"
      - "tools/estop_can.py"
      - "tools/health_frame.py"
      - "tools/slot_scan.py"
      - "contracts/can_ids.json"
      - ".github/workflows/vcan-check.yml"

permissions:
  contents: read

jobs:
  vcan:
    name: Run the bus contract over vcan0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Bring up vcan0
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo modprobe vcan; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq linux-modules-extra-"$(uname -r)" || sudo apt-get install -y -qq linux-modules-extra-azure || true
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run the contract over vcan0
        shell: bash
        run: |
          python3 tests/vcan_check.py vcan0
          python3 tests/vcan_urtc_vectors.py vcan0
