name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          arm-packages: libnewlib-arm-none-eabi
          lint: full

  # These read the sources and the committed firmware files as they are: the compilation of the baseline job rewrites that directory, so they run beside it, not after it.
  guards:
    name: Source guards and firmware inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the CM5 SPI bridge and firmware source-guard tests
        if: ${{ hashFiles('src/cm5_host/spi_bridge/tests/test_protocol.py') != '' }}
        run: |
          PYTHONPATH=src/cm5_host/spi_bridge:src/cm5_host/spi_bridge/tests python -m unittest discover -s src/cm5_host/spi_bridge/tests -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check the committed firmware inventory against its manifest
        if: ${{ hashFiles('tools/verify_firmware_inventory.py') != '' }}
        run: python tools/verify_firmware_inventory.py
