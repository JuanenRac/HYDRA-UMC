name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          arm-packages: libnewlib-arm-none-eabi
      - name: Run the CM5 SPI bridge and firmware source-guard tests
        if: ${{ hashFiles('src/cm5_host/spi_bridge/tests/test_protocol.py') != '' }}
        run: |
          PYTHONPATH=src/cm5_host/spi_bridge:src/cm5_host/spi_bridge/tests python -m unittest discover -s src/cm5_host/spi_bridge/tests -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check the committed firmware inventory against its manifest
        if: ${{ hashFiles('tools/verify_firmware_inventory.py') != '' }}
        run: python tools/verify_firmware_inventory.py
