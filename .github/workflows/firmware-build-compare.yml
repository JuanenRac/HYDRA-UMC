name: Firmware build compare

# Started by hand. Builds the whole firmware with the shell script and with tools/build_firmware.py using the real arm-none-eabi-gcc, and fails if the
# two do not leave the same files in firmware/, byte for byte (SHA-256). Nothing is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare the firmware that the two scripts build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version
      - name: Build with both scripts and compare the SHA-256 of firmware/
        run: python3 tools/compare_firmware_builds.py
