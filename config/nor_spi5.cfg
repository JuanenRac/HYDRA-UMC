# HYDRA-UMC - config/nor_spi5.cfg
# The pins and the timeout of SPI5, the bus of the NOR flash that holds the backup copy of the CM7 application (tools/boot_nor_stage.py, src/mcu_stm32h757/Common/nor_spi5_pins.h, src/mcu_stm32h757/CM7/boot/bootloader_nor.c).
# Starting values for the bench, not measurements: the netlist of the board is not in this repository, so the pins are the SPI5 alternate function 5 pins that nothing else of the profile uses and are to be
# replaced by the ones on the board before the long slot is switched on (bench row 32 of docs/BENCH_TESTS.md). The use of the NOR by the bootloader ships off (HYDRA_NOR_BACKUP 0).

[pins]
# Port letter (A..K) and pin number (0..15). The three pins of the bus are on the same port; the chip select is driven by software and may be on another.
cs = F6
sck = F7
miso = F8
mosi = F9
# The alternate function number of SPI5 on the pins of the bus (0..15).
alternate = 5

[spi]
# How long one transfer may take before it is aborted (milliseconds, 1..1000).
transfer_timeout_ms = 20
