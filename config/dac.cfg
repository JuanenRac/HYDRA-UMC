# HYDRA-UMC - config/dac.cfg
# The two 0 to 10 V analog outputs of the H757 board, AO1 on PA4 and AO2 on PA5, the two channels of DAC1 behind an amplifier (tools/dac_plan.py, src/mcu_stm32h757/Common/dac_plan.h,
# src/mcu_stm32h757/CM7/DacOut.c). Starting values for the bench, not measurements: the gain of the amplifier is read from the netlist of the board when it is known (a gain of 3 gives
# 9.9 V from a 3.3 V reference). Both outputs start at 0 V. The outputs ship off (HYDRA_DAC_CM7 0).

[dac]
# The reference voltage of the DAC in millivolts (1800..3600).
vref_mv = 3300
# The amplifier: the voltage at the output is the voltage at the pin times gain_num / gain_den (each 1..1000).
gain_num = 3
gain_den = 1

[ceiling]
# The highest voltage each output may be asked for, in millivolts (0..10000); a request over it is refused. Kept under the 10 V of the standard.
ao1_mv = 9900
ao2_mv = 9900
