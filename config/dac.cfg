# HYDRA-UMC - config/dac.cfg
# The two 0 to 10 V analog outputs of the H757 board, AO1 on PA4 and AO2 on PA5, the two channels of DAC1 behind an amplifier (tools/dac_plan.py, src/mcu_stm32h757/Common/dac_plan.h,
# src/mcu_stm32h757/CM7/DacOut.c). Starting values for the bench, not measurements: the gain of the amplifier is the one of the resistors of the design (it is checked on a board). The amplifier of the board is a non-inverting stage with 20.0 k over 9.76 k, a gain of 1 + 20.0 / 9.76 = 186 / 61 (3.049), which would give 10.06 V from a 3.3 V
# reference at the full code; the ceiling below keeps the output under 10 V until the gain and the offset are measured on a board. Both outputs start at 0 V. The outputs ship off (HYDRA_DAC_CM7 0).

[dac]
# The reference voltage of the DAC in millivolts (1800..3600).
vref_mv = 3300
# The amplifier: the voltage at the output is the voltage at the pin times gain_num / gain_den (each 1..1000).
gain_num = 186
gain_den = 61

[ceiling]
# The highest voltage each output may be asked for, in millivolts (0..10000); a request over it is refused. Kept under the 10 V of the standard.
ao1_mv = 9900
ao2_mv = 9900
