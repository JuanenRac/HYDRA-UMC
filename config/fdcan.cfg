# HYDRA-UMC - config/fdcan.cfg
# How FDCAN1 of the H757 board is started on the stack bus (tools/fdcan_plan.py, src/mcu_stm32h757/Common/fdcan_plan.h, src/mcu_stm32h757/CM7/Fdcan1Start.c). Starting values for the bench,
# not measurements: the bit rate is only right if the kernel clock is the one written here (the clock tree gives 100 MHz from PLL2_Q), and bench rows 9 and 10 of docs/BENCH_TESTS.md
# measure it on a board. The start-up ships off (HYDRA_FDCAN1_START 0).

[bus]
# The FDCAN kernel clock in hertz (1000000..200000000) and the nominal bit rate in bit/s (10000..1000000). The timing must give the bit rate exactly or it is refused.
kernel_hz = 100000000
bit_rate_bps = 1000000
# Where the bit is sampled, in thousandths of the bit (500..950), and the most time quanta a bit may have (8..128): the smallest prescaler that fits is taken.
sample_permille = 850
max_quanta = 20
# The synchronisation jump width in quanta (1..4); it may not be longer than segment 2 (3 here: 1 + 16 + 3 = 20 quanta at 50 ns, 1 Mbit/s, sample point 85 percent).
sjw = 3

[queues]
# Elements of the receive FIFO0 and of the transmit FIFO (each 1..32).
rx_elements = 8
tx_elements = 8

[filters]
# 1 adds the filter of the emergency stop (id 0x001) to the one of the window of the controller boards (0x600..0x7FF), as the CM4 of the H745 board does; 0 takes only the window.
estop = 1
