# HYDRA-UMC - config/i2c_buses.cfg
# How I2C1, I2C2 and I2C3 of the H757 board are timed when the CM7 owns them (tools/i2c_plan.py, src/mcu_stm32h757/Common/i2c_plan.h, src/mcu_stm32h757/CM7/I2cBuses.c). The keys are those
# of config/i2c4.cfg. Starting values for the bench, not measurements: the rise and fall times are those of the usual pull-ups and are to be replaced by the ones measured with a scope.
# The buses ship off (HYDRA_I2C_BUSES_CM7 0).

[i2c1]
# The front panel and the I/O expander (status, error and update lights, enable and fault of the field side): SCL PB6, SDA PB7.
kernel_hz = 100000000
speed_hz = 100000
rise_ns = 400
fall_ns = 100
analog = 1
digital = 0

[i2c2]
# The touch controller of the display: SCL PH4, SDA PH5. Fast mode.
kernel_hz = 100000000
speed_hz = 400000
rise_ns = 200
fall_ns = 50
analog = 1
digital = 0

[i2c3]
# The expansion cards (the PCIe slots): SCL PA8, SDA PC9.
kernel_hz = 100000000
speed_hz = 100000
rise_ns = 400
fall_ns = 100
analog = 1
digital = 0
