# HYDRA-UMC machine configuration of the controller board firmware.
# Every tuned value of the stop lives here, never in the source. After editing run:
#     python tools/machine_cfg.py generate
# which rewrites src/mcu_stm32g474/machine_config.h (the build reads that header; a test fails when it is stale).

[stop]
# Stop category of an axis when a stop arrives (bus frame on 0x001 or the physical input):
#   0 = cut the driver enable of the axis at once (the default and the safe choice)
#   1 = ask the motion layer to decelerate, then cut the enable after ramp_max_ms at the latest
default_category = 0
# Per axis override (1..6). Empty or missing = default_category.
axis1_category =
axis2_category =
axis3_category =
axis4_category =
axis5_category =
axis6_category =
# Longest time a category 1 axis may keep its driver enabled after a stop (milliseconds, 1..2000).
ramp_max_ms = 200

[estop_input]
# The physical emergency stop input, normally closed (NC) to the level named by healthy_level.
# A cut wire, an opened contact or a failed pull resistor reads as the stop level and trips the board.
enabled = 1
# One of the pins the pinout lists as free: PA7, PA12, PB4, PC9 (PC5 and PC8 are reserved for the CAN standby lines).
port = C
pin = 9
# Level read while the loop is closed and healthy: 0 (loop closes the pin to ground, the internal pull is up) or 1 (the reverse, pull down).
healthy_level = 0
# Time a new level must stay unchanged before it counts (milliseconds). A stop is accepted faster than a return to healthy.
trip_debounce_ms = 2
clear_debounce_ms = 50
# Period at which a stop frame from this input repeats on the stack bus while the loop is open (milliseconds).
trip_repeat_ms = 5

[production]
# Read-out protection level a production flash sets: 0 = off (nothing protected, the default) or 1. Level 2 is never offered.
rdp_level = 0
