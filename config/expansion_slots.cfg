# HYDRA-UMC - config/expansion_slots.cfg
# The power sequence and fault handling of the three expansion slots (tools/expansion_slots.py, src/mcu_stm32h757/Common/expansion_slots.h, docs/EXPANSION_SLOTS.md). Starting values for the bench, not measurements.

[slots]
# Which slots may be powered: bit 0 is slot 1, bit 1 slot 2, bit 2 slot 3 (0..7). EMPTY BY DEFAULT: a slot that is not named here stays off with its card held in reset, whatever is plugged in.
allowed_mask = 0
# After the enable line goes high the fault line is ignored for this long, the inrush of the card (milliseconds, 1..1000, below power_good_ms).
fault_blank_ms = 20
# How long the card is powered with the fault line quiet before reset is released (milliseconds, above fault_blank_ms, up to 5000).
power_good_ms = 50
# How long the card is out of reset before the slot is READY (milliseconds, 1..1000).
reset_release_ms = 20
# How long the fault line must stay low in READY before the slot is cut (milliseconds, 0..1000).
fault_debounce_ms = 5
# Faults of one slot before it is locked and only a person can unlock it (1..20).
max_faults = 3
