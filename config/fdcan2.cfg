# HYDRA-UMC - config/fdcan2.cfg
# How FDCAN2 of the H757 board, the field bus CAN_FIELD behind the isolated transceiver (pins PB12 and PB13), is started (tools/fdcan_plan.py, src/mcu_stm32h757/Common/fdcan_plan.h,
# src/mcu_stm32h757/CM7/Fdcan1Start.c, which starts either controller). Starting values for the bench, not measurements. It shares the message RAM with FDCAN1 and is placed after it.
# The start-up ships off (HYDRA_FDCAN1_START 0).

[bus]
# As in fdcan.cfg: the kernel clock of the FDCAN (100 MHz from PLL2_Q), the bit rate (1 Mbit/s, as the tool head bus), the sample point and the most time quanta of a bit.
kernel_hz = 100000000
bit_rate_bps = 1000000
sample_permille = 850
max_quanta = 20
sjw = 4

[queues]
rx_elements = 8
tx_elements = 8

[field]
# The one acceptance filter of the field bus (11-bit id and mask). The ids of the tool head are not fixed yet, so the starting mask is 0: every standard id goes to RX FIFO0 until
# the ids are decided and the filter is narrowed here.
filter_id = 0x000
filter_mask = 0x000
