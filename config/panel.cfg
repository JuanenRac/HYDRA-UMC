# HYDRA-UMC - config/panel.cfg
# The DSI link and the start-up of the display panel (ILI9881) of the H757 board (tools/dsi_plan.py, src/mcu_stm32h757/Common/dsi_plan.h, src/mcu_stm32h757/Common/panel_start.h,
# src/mcu_stm32h757/Common/panel_init_table.h, which tools/dsi_plan.py makes from the [init] section: run `python tools/dsi_plan.py --write` after changing it). The size and the porches
# of the picture are those of config/display.cfg. Starting values for the bench, not measurements of a panel.

[dsi]
# The crystal that feeds the DSI PLL (Hz), the data lanes used (1 or 2), the lane rate asked for (kbit/s) and how far from it the PLL may land (thousandths, 0..50).
hse_hz = 25000000
lanes = 2
lane_kbps = 600000
tolerance_permille = 5
# The bits per pixel on the link (16, 18 or 24) and the refresh rate of the picture (10..120). The link has to carry the pixel data plus 15 percent for the packets.
bpp = 16
fps = 60

[reset]
# The panel has no reset line from the H757 on this revision (the net PC15 is a spare that is not wired to the display connector): the reset of the panel is the supply or the I2C of its own board,
# to be confirmed on a board. These times are the pause the start-up code keeps before the first command.
# How long the reset line of the panel is held low and then high before the first command (milliseconds, 1..1000).
low_ms = 10
high_ms = 120

[init]
# One line per command, in the order they are sent: stepNN = <command byte followed by its parameters, in hexadecimal> ; <wait after it in milliseconds>.
# The vendor-specific commands of the ILI9881 (the pages of registers that set up the panel) are NOT here: they are in the init code of the panel maker and are to be added between
# the lines below, exactly as the maker lists them, when the panel is chosen; the table waits for the data sheet of the panel maker and nothing is invented here. Without them the panel only runs on the defaults of its controller.
step01 = 11 ; 120
step02 = 29 ; 20
