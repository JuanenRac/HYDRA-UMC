# HYDRA-UMC - config/i2c4.cfg
# How I2C4 of the H757 board (the F-RAM U7 on the main board) is timed when the CM7 owns it (tools/i2c_plan.py, src/mcu_stm32h757/Common/i2c_plan.h, src/mcu_stm32h757/CM7/FramI2c4.c).
# Starting values for the bench, not measurements: the rise and fall times are those of 4.7 kOhm pull-ups on a short bus and are to be replaced by the ones measured with a scope
# (bench row 31 of docs/BENCH_TESTS.md). The use of I2C4 by the CM7 ships off (HYDRA_FRAM_I2C4_CM7 0).

[bus]
# The kernel clock of I2C4 in hertz (1000000..200000000, 100 MHz from the clock tree) and the bus speed in hertz (10000..400000; up to 100000 is standard mode, above is fast mode).
kernel_hz = 100000000
speed_hz = 100000
# The rise time (1..1000 ns in standard mode, 1..300 in fast mode) and the fall time (1..300 ns) of SCL and SDA as the board makes them.
rise_ns = 400
fall_ns = 100

[filters]
# The analog noise filter of the pins (1 on, 0 off) and the digital filter in kernel clock periods (0..15).
analog = 1
digital = 0
