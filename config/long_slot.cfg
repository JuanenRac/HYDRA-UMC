# HYDRA-UMC - config/long_slot.cfg
# The long-slot variant of the CM7 firmware of the H757 board: the bootloader built with the 768 KB application slot and the application linked with the 768 KB script (tools/long_slot_plan.py,
# tools/build_firmware.py step 10c, docs/H757_MEMORY_MAP.md). The variant is a build option that ships OFF: a build made without HYDRA_LONG_SLOT=1 in its environment makes exactly the six images
# it made before, byte for byte (the comparison workflow h745-invariance proves it), and the long images are never moved into firmware/. Starting values for the bench, not measurements.

[variant]
# The folder of the build (under build/h7) where the long-slot objects, the images and their sums are left; they are not part of the shipped set.
output_dir = long_slot
# The suffix of the names of the long-slot images, so that they can never be mistaken for the images of the default set.
image_suffix = LONG_SLOT

[bootloader]
# The definitions with which the CM7 bootloader is compiled for the long slot. The slot refuses to build without the copy in the NOR (HYDRA_NOR_BACKUP) and the copy needs the SPI5 driver.
defines = HYDRA_PLATFORM_H757 HYDRA_APP_SLOT_768K=1 HYDRA_NOR_BACKUP=1 HYDRA_NOR_SPI5=1

[application]
# The linker script of the CM7 application of the long slot (the default build keeps STM32H757XIHx_CM7_APP.ld with 384 KB).
linker = src/mcu_stm32h757/CM7/STM32H757XIHx_CM7_APP_768K.ld

[budget]
# What the linked application and the interface must leave free in the 768 KB slot, as a percentage of it. The interface is the figure of tools/ui_budget.py (the 300 KiB of the library are
# for the linked firmware, so they are compared here, with the size of the application that was just linked, and not before).
free_percent = 10
