# HYDRA-UMC - config/tmc_card.cfg
# The SPI6 driver of the TMC5160 drivers on the expansion cards (tools/tmc_card.py, src/mcu_stm32h757/CM7/TmcCardSpi6.c, docs/EXPANSION_SLOTS.md). Starting values for the bench, not measurements.

[spi6]
# How long the two select lines settle before the strobe PG3 goes low (microseconds, 1..1000).
settle_us = 5
# How long one 5-byte datagram may take before the transfer is aborted (milliseconds, 1..1000).
transfer_timeout_ms = 20
