# HYDRA-UMC - config/ui.cfg
# The tuned values of the interface that runs on the STM32H757 (docs/DSI_EN_H757.md). Nothing here is typed into the source: tools/ui_gen.py turns this file
# into src/ui_h757/core/ui_config.h and tests/test_ui_core.py checks that the header is what this file says. Every value is a starting value for the bench, not a measurement.
# The defaults are the conservative ones: with the Jetson silent, only status, alarms and STOP work; nothing moves and the stop is not released from the panel.

[ui]
# The Jetson answers a heartbeat every 100 ms; this many ms without one and the panel is in the degraded mode.
jetson_timeout_ms = 1500
# A Jetson takes tens of seconds to start: until this long after power-up, no heartbeat is "starting", not a fault.
jetson_boot_grace_ms = 90000
# This many failed SPI transactions in a row (bad check or no READY) and the cause shown is the link, not the Jetson.
spi_fault_after_errors = 5
# STOP was touched and the brain has not reported the latched stop after this long: the panel says so and raises an alarm.
stop_confirm_ms = 500
# The stop is latched and the brain still reports motion after this long: an alarm.
stop_motion_ms = 1000
# Long press needed to release the stop and to leave listen-only.
release_hold_ms = 1500
listen_off_hold_ms = 1500
# How long the jog stays armed after the touch.
jog_arm_ms = 10000
# Stack bus error counter (the larger of transmit and receive) from which the bus is "errors rising"; 128 is error passive.
can_warn_errors = 96
# Switches, both 0 (conservative): with the Jetson not answering the panel may still release the stop / may still jog.
degraded_allow_release = 0
degraded_allow_motion = 0
# Optional operator PIN of the panel (a security option, off by default; goes to the Studio with the conservative default). STOP never asks for it, and neither do the screens that
# only show. With it on, every command but STOP is refused while the panel is locked; the core only learns that a PIN was right or wrong (the digits never enter it).
operator_pin_enabled = 0
# Wrong PINs in a row before the lock-out, how long the lock-out lasts, and how long without a touch before the panel locks again.
pin_max_failures = 3
pin_lockout_ms = 30000
pin_idle_ms = 120000
# The build switch of the firmware part of the interface (HYDRA_UI_H757) is in the build, not here: it ships off.

[budget]
# Inputs of the memory budget (tools/ui_budget.py). The SDRAM of the H757 board is not fixed: the board documents give two banks of 128 MiB, and the owner will add RAM; the
# exact model and size are to be confirmed by the owner (pending decision), so the size is a value here, never a figure of the code. The default is bank 1 alone, 128 MiB (decision of the
# owner: bank 2 is optional and off by default); with both banks fitted and HYDRA_SDRAM_BANK2_ENABLED=1 the value is 268435456 = 256 MiB.
sdram_bytes = 134217728
# 0 until the owner confirms the model and the size of the SDRAM.
sdram_confirmed = 0
# The still image of a camera on the panel (decision of the owner): size in pixels of the picture the Jetson sends, pictures per second, and the bytes of one JPEG picture.
camera_thumb_width = 320
camera_thumb_height = 180
camera_thumb_fps = 2
camera_thumb_jpeg_bytes = 24576
# Clock of the SPI link to the Jetson and the share of it the pictures may use (the rest is for the status exchange and the updates).
spi_link_clock_hz = 10000000
spi_thumb_max_fraction = 0.3

[pin]
# The store of the operator PIN (tools/ui_pin.py): a salted PBKDF2-HMAC-SHA256 hash is kept in the F-RAM, never the digits. The iterations are a starting value: the cost on the
# Cortex-M7 is not measured (one check must be short enough for the pad and long enough to slow a guess). The lengths bound the PIN the Studio accepts.
pin_hash_iterations = 10000
pin_min_digits = 4
pin_max_digits = 8
# The estimate of the time of one check on the Cortex-M7 (tools/ui_pin_cost.py counts the compressions exactly; the cycles per compression are NOT measured): about 40 cycles per byte
# for a software SHA-256 is 2600 for a block of 64 bytes; the hash peripheral of the H757, if used, would take far fewer (the datasheet and a bench measurement decide).
pin_cycles_per_block = 2600
pin_hw_cycles_per_block = 200
# A check must take less than this for the pad to feel right (the pad is not the stop path: nothing waits for it).
pin_check_max_ms = 300

[sched]
# The tasks of the interface on the CM7 for the model of tools/ui_sched_sim.py: ESTIMATES of the design, not measurements (the latency of the stop is measured on the board).
# The touch interrupt only leaves a request; the stack bus task (period 1 ms) sends the stop frame; the link task polls the Jetson; the interface task draws; the PIN check is a long
# job of the interface priority. The limit is the longest time from a touch of STOP to the stop frame the design accepts.
stack_task_period_us = 1000
stack_task_wcet_us = 200
touch_isr_us = 50
link_task_period_ms = 100
link_task_wcet_us = 500
ui_task_period_ms = 33
ui_task_wcet_ms = 25
pin_check_ms = 130
stop_max_latency_ms = 5
