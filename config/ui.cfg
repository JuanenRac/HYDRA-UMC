# HYDRA-UMC - config/ui.cfg
# The tuned values of the interface that runs on the STM32H757 (docs/DSI_EN_H757.md). Nothing here is typed into the source: tools/ui_gen.py turns this file
# into src/ui_h757/core/ui_config.h and tests/test_ui_core.py checks that the header is what this file says. Every value is a starting value for the bench, not a measurement.
# The defaults are the conservative ones: with the Jetson silent, only status, alarms and STOP work; nothing moves and the stop is not released from the panel.

[ui]
# The Jetson answers a heartbeat every 100 ms; this many ms without one and the panel is in the degraded mode.
jetson_timeout_ms = 1500
# A Jetson takes tens of seconds to start: until this long after power-up, no heartbeat is "starting", not a fault.
jetson_boot_grace_ms = 90000
# This many failed SPI transactions in a row (bad check or no READY) and the cause shown is the link, not the Jetson.
spi_fault_after_errors = 5
# STOP was touched and the brain has not reported the latched stop after this long: the panel says so and raises an alarm.
stop_confirm_ms = 500
# The stop is latched and the brain still reports motion after this long: an alarm.
stop_motion_ms = 1000
# Long press needed to release the stop and to leave listen-only.
release_hold_ms = 1500
listen_off_hold_ms = 1500
# How long the jog stays armed after the touch.
jog_arm_ms = 10000
# Stack bus error counter (the larger of transmit and receive) from which the bus is "errors rising"; 128 is error passive.
can_warn_errors = 96
# Switches, both 0 (conservative): with the Jetson not answering the panel may still release the stop / may still jog.
degraded_allow_release = 0
degraded_allow_motion = 0
# The build switch of the firmware part of the interface (HYDRA_UI_H757) is in the build, not here: it ships off.
