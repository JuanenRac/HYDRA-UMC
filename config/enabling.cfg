# HYDRA-UMC - config/enabling.cfg
# The times of the logic of the three-position enabling device (tools/enabling_device.py, src/mcu_stm32h757/CM4/enabling_device.h). Starting values for the bench, not measurements.

[enabling]
# A position must be read by both channels for this long before it counts (milliseconds, 1..200). Leaving the middle position asks for the stop at once: the debounce never delays a stop.
debounce_ms = 20
# The two channels may disagree for this long while the switch moves from one position to the next (milliseconds, from debounce_ms to 2000); longer is a fault and asks for the stop.
discrepancy_ms = 100
