# HYDRA-UMC - config/display.cfg
# The picture the LTDC and the DMA2D of the H757 board draw (tools/display_plan.py, src/mcu_stm32h757/Common/display_plan.h, src/mcu_stm32h757/CM7/DisplayLtdc.c, docs/DSI_EN_H757.md).
# Starting values for the bench, not measurements of a panel: the porches of the real panel are to be confirmed with its data sheet. The driver ships off (HYDRA_DISPLAY_LTDC 0).

[panel]
# Size of the picture in pixels (1..2048) and the format: rgb565 or argb8888. The interface is landscape only.
width = 1280
height = 720
format = rgb565
# Sync, back porch and front porch of the horizontal axis (pixel clocks) and of the vertical axis (lines); each 1..1024.
hsync = 4
hbp = 60
hfp = 60
vsync = 4
vbp = 16
vfp = 16

[driver]
# How many times a DMA2D fill or copy is polled before it is given up (1..1000000).
poll_limit = 100000
