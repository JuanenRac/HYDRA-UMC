# HYDRA-UMC - config/lvgl.cfg
# The interface library of the H757 board, the tick that feeds it and the touch controller that gives it the input (tools/lvgl_pin.py, tools/ui_tick_plan.py, tools/touch_gt911.py,
# src/mcu_stm32h757/Common/ui_tick_plan.h, src/mcu_stm32h757/Common/touch_gt911.h, docs/UI_STACK_H757.md). Starting values for the bench, not measurements. The library is NOT in this
# repository: it is fetched by its commit in Actions (.github/workflows/lvgl-library.yml) and compiled there; the tick and the touch input ship off (HYDRA_UI_TICK 0, HYDRA_TOUCH_GT911 0).

[library]
# The project, the release the pin was taken from and the exact commit of that release (40 hexadecimal digits). The commit is what is fetched; the tag is only its name.
repository = https://github.com/lvgl/lvgl
tag = v9.6.0
commit = 80ca777e37a2b176770726a02e07a6fb79ef0b39
license = MIT
# What the compiled library may take of the CM7 flash, in bytes (the upper figure the interface budget counts: 300 KiB), checked by the build in Actions.
flash_budget_bytes = 307200

[tick]
# The library is fed with the milliseconds that went by since the last feed. A stall longer than catchup_max_ms is fed as catchup_max_ms (animations jump, they do not replay a burst).
catchup_max_ms = 100
# How long the interface task sleeps between two calls of the timer handler of the library: what the library asks for, held between these two bounds (1..1000 ms).
handler_min_ms = 5
handler_max_ms = 33

[touch]
# The touch controller on I2C2 of the board. Only the GT911 is implemented; the model on the real panel is to be confirmed with its data sheet (pending). The address is the 7-bit one: 0x5D, or 0x14.
controller = gt911
address = 0x5D
# The size of the raw coordinates the controller reports and the size of the picture they are mapped to; swap and mirror turn a panel mounted in another orientation.
raw_width = 1280
raw_height = 720
swap_xy = 0
mirror_x = 0
mirror_y = 0
# How often the interface task asks the controller for a sample, in ms (5..100).
poll_ms = 10
