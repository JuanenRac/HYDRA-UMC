# HYDRA-UMC - config/host_link.cfg
# The transport of the host link with the board as SPI master (tools/host_link_master.py, src/mcu_stm32h757/Common/host_link_master.h, docs/HOST_LINK_MASTER.md). Starting values for the bench, not measurements.

[link]
# The board clocks an idle frame this often when it has nothing to send and the host did not raise READY, so the host can hand in a request even without the READY line (milliseconds, 1..10000).
idle_interval_ms = 50
# The least time between two transactions, so the host can stage its next frame (milliseconds, 0..1000, not above idle_interval_ms).
min_gap_ms = 2
# How many times a frame that went out is sent again when the frame that came back was damaged, before it is dropped and counted (0..10).
max_retries = 3
# Failures of the peripheral in a row before the link is marked down (1..100). The emergency stop does not travel on this link.
down_after_failures = 5
# 1: a frame that comes in without the seal (marker, sequence, CRC-16) is refused. 0 accepts the frames of the older kind. The conservative value is 1.
require_seal = 1
# 1: the READY line of the host is read and a transaction runs when it is high. 0: the line is not wired (the schematic does not draw it yet) and the link runs on the idle interval alone.
ready_known = 0
