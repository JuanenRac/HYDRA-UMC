# HYDRA-UMC - config/usb_host.cfg
# The front USB port of the H757 board (USB_OTG_FS: D- on PA11, D+ on PA12, VBUS sense on PA9) as a full-speed host (tools/usb_host_plan.py, src/mcu_stm32h757/Common/usb_host_plan.h,
# src/mcu_stm32h757/CM7/UsbHostFs.c). Starting values for the bench, not measurements. The host ships off (HYDRA_USB_HOST_CM7 0).

[host]
# How many of the 12 host channels of the controller are used (1..12).
host_channels = 8
# 1 = the VBUS sense pin PA9 is used (the board has it); 0 = the pin is left alone.
vbus_sensing = 1
# 1 = the start-of-frame pulse is put on a pin; 0 = it is not.
sof_output = 0

[interrupt]
# The priority of the USB interrupt (0 = the most urgent, 15 = the least). It has to be a priority that the real-time operating system of the CM7 allows for interrupt service
# routines that call it; the value is a starting one until the priorities of the CM7 are fixed.
priority = 5
