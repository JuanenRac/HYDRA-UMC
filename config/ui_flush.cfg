# HYDRA-UMC - config/ui_flush.cfg
# The render buffer of the interface library of the H757 board (tools/ui_flush_plan.py, src/mcu_stm32h757/Common/ui_flush_plan.h). The library renders into a band of whole lines of
# the picture and the finished areas are copied into the frame buffer by the DMA2D. The size of the picture is that of config/display.cfg. Starting values, not measurements: a tenth
# of the frame is the render buffer that the interface budget of docs/UI_STACK_H757.md counts (298 KiB of the AXI SRAM with it).

[buffer]
# The size of one render buffer in KiB (4..2048) and how many there are (1 or 2). One buffer of 180 KiB is a tenth of a 1280 x 720 frame in 16 bits (72 lines); a second buffer
# lets the library render while the previous band is copied, and does not fit the interface budget until that budget is raised.
size_kb = 180
count = 1
