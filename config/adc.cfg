# HYDRA-UMC - config/adc.cfg
# The analog inputs of the H757 board and how a reading of the ADC becomes millivolts (tools/adc_plan.py, src/mcu_stm32h757/Common/adc_plan.h, src/mcu_stm32h757/CM7/AdcReader.c).
# Starting values for the bench, not measurements. The inputs and the pins are those of docs/platform_profiles.json (board_io). The ADC and channel numbers are the ones the data sheet
# of the family gives for those pins and are to be confirmed in CubeMX; an input whose ADC is 0 is not yet assigned and is refused when read. The ratios are 1 to 1 until the dividers
# and the current-sense gains are read from the netlist of the board; replace them then. The reader ships off (HYDRA_ADC_CM7 0).

[adc]
# The reference voltage of the ADC in millivolts (1800..3600), the resolution (12 or 16 bits), how many conversions are averaged (1..64), the time to wait for one conversion in
# milliseconds (1..1000) and the sampling time in ADC clock cycles (16.5, 64.5 or 387.5).
vref_mv = 3300
bits = 16
samples = 8
timeout_ms = 10
sample_time = 64.5

[channels]
# name = adc, channel, num, den, offset_mv : the signal in millivolts is the millivolts at the pin times num / den plus offset_mv.
# The voltages of the rails (the pins marked _C are the separate analog pads of the same port pin):
v24 = 1, 0, 1, 1, 0
jetson = 1, 1, 1, 1, 0
usb5v = 1, 16, 1, 1, 0
m2_5v = 1, 17, 1, 1, 0
hailo = 1, 14, 1, 1, 0
nvme = 1, 15, 1, 1, 0
wifi = 1, 3, 1, 1, 0
fan5v = 1, 7, 1, 1, 0
ctrl3v3 = 3, 1, 1, 1, 0
ctrl5v = 3, 0, 1, 1, 0
# The currents (the sense voltage in millivolts until the gains are known):
i_v24_total = 1, 9, 1, 1, 0
i_jetson = 1, 5, 1, 1, 0
i_usb = 1, 11, 1, 1, 0
i_m2 = 1, 4, 1, 1, 0
i_ctrl = 1, 8, 1, 1, 0
i_fan = 0, 0, 1, 1, 0
# The two analog inputs of the field side (PH2 and PF10 on the board):
ai1 = 0, 0, 1, 1, 0
ai2 = 3, 6, 1, 1, 0
