# HYDRA-UMC - config/nor_backup.cfg
# Where the backup copy of the CM7 application lives in the NOR flash of SPI5 when the application slot is 768 KB (tools/nor_backup_plan.py, src/mcu_stm32h757/Common/nor_backup_plan.h).
# Starting values for the bench, not measurements. The use of the copy ships off (HYDRA_NOR_BACKUP 0) and nothing in the bootloader calls it yet.

[nor]
# The first byte of the copy in the NOR (a multiple of the 64 KB block) and the size of the NOR (the GD25Q128E is 16 MiB).
offset_bytes = 0
size_bytes = 16777216

[slot]
# The size of the application slot of the CM7 that the copy protects (a multiple of the 4 KB sector; 786432 is 768 KB, the end of bank 1 from 0x08040000).
app_bytes = 786432

[previous]
# The first byte of the region that keeps the application that ran before an update (a multiple of the 64 KB block, at or after the end of the copy above: 64 KB + 768 KB from its first byte, so 851968).
offset_bytes = 851968

[update]
# 1: an update whose backup of the running application failed is refused; 0: it goes on without the backup (the current copy still restores a cut of the power, only the way back is lost).
require_backup = 1
