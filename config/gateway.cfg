# HYDRA-UMC - config/gateway.cfg
# The stack tier of the gateway of the H757 board (tools/gateway_cfg.py, src/mcu_stm32h757/Common/gateway_stack_a.h, src/mcu_stm32h757/CM7/GatewayFdcan1.c). Starting values for the bench.

[stack_a]
# How long the gateway waits for the answer of a controller board on FDCAN1 before the host gets STATUS_ERROR (milliseconds, 1..1000). The CM4 of the H745 board waits 200.
timeout_ms = 200
