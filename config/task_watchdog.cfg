# HYDRA-UMC - config/task_watchdog.cfg
# The tasks the supervisor of liveness watches and the times of its bound (tools/task_watchdog.py, src/mcu_stm32h757/CM4/task_watchdog.h). Starting values for the bench, not measurements.

[watchdog]
# How often the supervisor looks at the check-ins (milliseconds, 1..100).
update_period_ms = 5
# The timeout of the hardware watchdog that cuts the outputs when the supervisor stops refreshing it (milliseconds, 10..5000).
iwdg_timeout_ms = 50
# The time the safety file allows between a task hanging and the outputs being cut (milliseconds). The bound below must fit in it, or this file is refused.
required_cut_ms = 150

# One section per task, in the order they are numbered (at most 8). deadline_ms: the longest the task may go without checking in (1..2000).
# mandatory = 1: a late task is a hang, the supervisor asks for the stop and stops refreshing the hardware watchdog for good. mandatory = 0: a late task only marks the system degraded.
[task.control]
deadline_ms = 20
mandatory = 1

[task.bus]
deadline_ms = 50
mandatory = 1

[task.ui]
deadline_ms = 500
mandatory = 0
